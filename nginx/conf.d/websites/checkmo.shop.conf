server {
    listen 80 default_server;
    server_name checkmo.shop;

    # 악성 요청 즉시 차단 (444는 연결을 바로 닫음)
    if ($block_suspicious = 1) {
        return 444;
    }

    # 악성 봇 차단
    if ($block_bot = 1) {
        return 444;
    }

    # 요청 방식 제한 (불필요한 메서드 차단)
    if ($request_method !~ "^(GET|POST|PUT|DELETE|PATCH|OPTIONS)$" ) {
        return 405;
    }

    # API 경로만 허용
    location ~ ^/api/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
        include /etc/nginx/conf.d/snippets/cors-settings.conf;
    }

    # OAuth2 경로 허용
    location ~ ^/login/oauth2/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
    }

    # /swagger-ui/ 로 시작하는 모든 경로 처리
    location /swagger-ui/ {
        limit_req off;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
    }

    # /v3/api-docs 로 시작하는 모든 경로 처리
    location /v3/api-docs {
        limit_req off;
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
    }

    # 헬스체크 경로만 허용
    location = /health {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
    }

    # 특정 파일 확장자 직접 차단
    location ~* \.(php|asp|aspx|jsp)$ {
        return 444;
    }

    # 숨김 파일 접근 차단
    location ~ /\. {
        return 444;
    }

    # 루트 경로 포함해서 그 외 모든 경로 차단
    location / {
        return 444;
    }

    include /etc/nginx/conf.d/snippets/security-headers.conf;
}