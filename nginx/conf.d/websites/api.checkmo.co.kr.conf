# ===========================================
# HTTP(80) -> HTTPS(443) 리다이렉트
# ===========================================
server {
    listen 80 default_server;
    server_name api.checkmo.co.kr;

    # 인증서 갱신용 경로 (HTTP에서 접근 가능해야 함)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 요청은 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# ===========================================
# HTTPS(443) 메인 설정
# ===========================================
server {
    listen 443 ssl;
    server_name api.checkmo.co.kr;

    # SSL 인증서 경로
    ssl_certificate /etc/letsencrypt/live/api.checkmo.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.checkmo.co.kr/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 악성 요청 즉시 차단 (444는 연결을 바로 닫음)
    if ($block_suspicious = 1) {
        return 444;
    }

    # 악성 봇 차단
    if ($block_bot = 1) {
        return 444;
    }

    # 요청 방식 제한 (불필요한 메서드 차단)
    if ($request_method !~ "^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$" ) {
        return 405;
    }

    # API 요청
    location ^~ /api/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
        include /etc/nginx/conf.d/snippets/cors-settings.conf;
    }

    # OAuth2 요청
    location ~ ^/(oauth2/authorization|login/oauth2)/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
        include /etc/nginx/conf.d/snippets/cors-settings.conf;
    }

    # /swagger-ui/ 로 시작하는 모든 경로 처리
    location /swagger-ui/ {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
    }

    # /v3/api-docs 로 시작하는 모든 경로 처리
    location /v3/api-docs {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
    }

    # 헬스체크 경로만 허용
    location = /health {
        proxy_pass http://backend;
        include /etc/nginx/conf.d/snippets/proxy-settings.conf;
    }

    # 특정 파일 확장자 직접 차단
    location ~* \.(php|asp|aspx|jsp)$ {
        return 444;
    }

    # 숨김 파일 접근 차단
    location ~ /\. {
        return 444;
    }

    # 루트 경로 포함해서 그 외 모든 경로 차단
    location / {
        return 444;
    }

    include /etc/nginx/conf.d/snippets/security-headers.conf;
}