spring:
  autoconfigure:
    exclude:
      - io.sentry.spring.boot.jakarta.SentryProfilerAutoConfiguration
      - io.sentry.spring.boot.jakarta.SentryLogbackAppenderAutoConfiguration
      - io.sentry.spring.boot.jakarta.SentryWebfluxAutoConfiguration
  profiles:
    include:
      - prod
      - redis
      - aladin
      - mail
      - jwt
      - oauth2
      - s3
      - monitoring
  modulith:
    events:
      completion-mode: DELETE

server:
  forward-headers-strategy: NATIVE

springdoc:
  use-fqn: true

checkmo:
  terms:
    enforcement-enabled: ${TERMS_ENFORCEMENT_ENABLED:false}
  sentry:
    enabled: ${SENTRY_ENABLED:false}
    dsn: ${SENTRY_DSN:}
    environment: ${SENTRY_ENVIRONMENT:local}
    release: ${SENTRY_RELEASE:local}
    traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

sentry:
  enabled: ${SENTRY_ENABLED:false}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false
  max-request-body-size: none
  logging:
    enabled: false

realtime:
  websocket:
    allowed-origins:
      - ${FRONTEND_BASE_URL}
      - http://localhost:3000

expo:
  push:
    access-token: ${EXPO_ACCESS_TOKEN:}
    enabled: ${EXPO_PUSH_ENABLED:true}
