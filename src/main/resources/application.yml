spring:
  profiles:
    include:
      - prod
      - redis
      - aladin
      - mail
      - jwt
      - oauth2
      - s3
  modulith:
    events:
      completion-mode: DELETE

server:
  forward-headers-strategy: NATIVE

springdoc:
  use-fqn: true

realtime:
  websocket:
    allowed-origins:
      - ${FRONTEND_BASE_URL}